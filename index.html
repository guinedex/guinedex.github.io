<!DOCTYPE html>
<html>
<head>
	<!-- bootstrap 5 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
	<!-- jquery 4 -->
	<script src=" https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js "></script>
	<!-- custom stuff -->
	<link href="style.css" rel="stylesheet">
	<script src="guinedex.js" type="text/javascript"></script>
</head>
<body class="bg-dark">
	<div class="container full-height">
		<div class="row full-height">
			<div class="col-3 py-3">
				<div class="card full-height">
					<div class="card-header">
						<h3 class="d-inline-block">Skins</h3>
						<button id="options-btn" type="button" class="btn btn-primary half-width float-end">
							<span>Options</span>
							<span id="options-btn-arrow" class="float-end">[>]</span>
						</button>
					</div>
					<div class="card-body">
						<div id="skin-list" class="d-flex flex-wrap">
						</div>
					</div>
				</div>
			</div>
			<div class="col py-3 max-full-height">
				<div id="skin-info" class="card full-height">
					<div class="card-header">
						<h3 class="card-title">Selected skin</h3>
					</div>
					<div id="skin-info-body" class="card-body overflow-auto">
					</div>
					<div class="card-footer d-none">
						<button id="save-skin" class="btn btn-success full-width">
							<p id="save-skin-text" class="text-center my-2">Save skin</p>
						</button>
					</div>
				</div>
				<div id="options" class="card full-height d-none">
					<div class="card-header">
						<h3 class="card-title">Options</h3>
					</div>
					<div id="options-body" class="card-body overflow-auto">

						<h3 class="card-title">Search filters</h3>

						<span class="card-subtitle mb-0"><b>Sort by</b></span>
						<select id="search_sort">
							<option value="ID">ID</option>
							<option selected value="Name">Name</option>
							<option value="Health">Health</option>
							<option value="Attack">Attack</option>
							<option value="Defense">Defense</option>
							<option value="Speed">Speed</option>
							<option value="Rarity">Rarity</option>
						</select>
						<label class="px-1 py-1" for="search_sort_reverse">
							<input type="checkbox" id="search_sort_reverse">
							Reverse
						</label><br>

						<input class="my-1" type="text" id="search_any" placeholder="Any field">
						<label class="px-1 py-1" for="search_any_fuzzy">
							<input type="checkbox" id="search_any_fuzzy">
							Fuzzy search
						</label><br>

						<input class="my-1" type="text" id="search_name" placeholder="Name"><br>

						<input class="my-1" type="text" id="search_description" placeholder="Skin description"><br>

						<input class="my-1" type="text" id="search_abilities" placeholder="Abilities">
						<label class="px-1 py-1" for="search_abilities_fuzzy">
							<input type="checkbox" id="search_abilities_fuzzy">
							Fuzzy search
						</label><br>

						<br>
						<p class="card-subtitle mb-0"><b>From crates</b></p>
						<div>
							<label class="px-1 py-1" for="search_crate_normal">
								<input type="checkbox" id="search_crate_normal">
								Normal
							</label>
							<label class="px-1 py-1" for="search_crate_daily">
								<input type="checkbox" id="search_crate_daily">
								Daily
							</label>
							<label class="px-1 py-1" for="search_crate_gold">
								<input type="checkbox" id="search_crate_gold">
								Gold
							</label>
						</div>
						<div>
							<label class="px-1 py-1" for="search_crate_spring">
								<input type="checkbox" id="search_crate_spring">
								Spring
							</label>
							<label class="px-1 py-1" for="search_crate_summer">
								<input type="checkbox" id="search_crate_summer">
								Summer
							</label>
							<label class="px-1 py-1" for="search_crate_fall">
								<input type="checkbox" id="search_crate_fall">
								Fall
							</label>
							<label class="px-1 py-1" for="search_crate_winter">
								<input type="checkbox" id="search_crate_winter">
								Winter
							</label>
						</div>

						<br>
						<p class="card-subtitle mb-0"><b>Rarity</b></p>
						<div>
							<label class="px-1 py-1" for="search_rarity_c">
								<input type="checkbox" id="search_rarity_c">
								Common
							</label>
							<label class="px-1 py-1" for="search_rarity_uc">
								<input type="checkbox" id="search_rarity_uc">
								Uncommon
							</label>
							<label class="px-1 py-1" for="search_rarity_r">
								<input type="checkbox" id="search_rarity_r">
								Rare
							</label>
							<label class="px-1 py-1" for="search_rarity_ur">
								<input type="checkbox" id="search_rarity_ur">
								Ultra-Rare
							</label>
							<label class="px-1 py-1" for="search_rarity_l">
								<input type="checkbox" id="search_rarity_l">
								Legendary
							</label>
						</div>

						<br>
						<p class="card-subtitle mb-0"><b>Element</b></p>
						<div>
							<label class="px-1 py-1" for="search_element_apex">
								<input type="checkbox" id="search_element_apex">
								Apex only
							</label>
						</div>
						<div>
							<label class="px-1 py-1" for="search_element_g">
								<input type="checkbox" id="search_element_g">
								<img src="element_g.png">
							</label>
							<label class="px-1 py-1" for="search_element_f">
								<input type="checkbox" id="search_element_f">
								<img src="element_f.png">
							</label>
							<label class="px-1 py-1" for="search_element_b">
								<input type="checkbox" id="search_element_b">
								<img src="element_b.png">
							</label>
							<label class="px-1 py-1" for="search_element_p">
								<input type="checkbox" id="search_element_p">
								<img src="element_p.png">
							</label>
							<label class="px-1 py-1" for="search_element_c">
								<input type="checkbox" id="search_element_c">
								<img src="element_c.png">
							</label>
							<label class="px-1 py-1" for="search_element_m">
								<input type="checkbox" id="search_element_m">
								<img src="element_m.png">
							</label>
						</div>

						<br>
						<p class="card-subtitle mb-0"><b>Attack target</b></p>
						<div>
							<label class="px-1 py-1" for="search_target_hp_high">
								<input type="checkbox" id="search_target_hp_high">
								High HP
							</label>
							<label class="px-1 py-1" for="search_target_atk_high">
								<input type="checkbox" id="search_target_atk_high">
								High ATK
							</label>
							<label class="px-1 py-1" for="search_target_def_high">
								<input type="checkbox" id="search_target_def_high">
								High DEF
							</label>
							<label class="px-1 py-1" for="search_target_spd_high">
								<input type="checkbox" id="search_target_spd_high">
								High SPD
							</label>
							<label class="px-1 py-1" for="search_target_random">
								<input type="checkbox" id="search_target_random">
								Random
							</label>
						</div>
						<div>
							<label class="px-1 py-1" for="search_target_hp_low">
								<input type="checkbox" id="search_target_hp_low">
								Low HP
							</label>
							<label class="px-1 py-1" for="search_target_atk_low">
								<input type="checkbox" id="search_target_atk_low">
								Low ATK
							</label>
							<label class="px-1 py-1" for="search_target_def_low">
								<input type="checkbox" id="search_target_def_low">
								Low DEF
							</label>
							<label class="px-1 py-1" for="search_target_spd_low">
								<input type="checkbox" id="search_target_spd_low">
								Low SPD
							</label>
						</div>

						<br>
						<p class="card-subtitle mb-0"><b>Stats</b></p>
						<div>
							<span class="allow-tabs">Health&#9;</span>
							<input class="my-1" type="number" id="search_hp_low" placeholder="0" min="0" max="999">
							<span>to</span>
							<input class="my-1" type="number" id="search_hp_high" placeholder="999" min="0" max="999">

							<br>
							<span class="allow-tabs">Attack&#9;</span>
							<input class="my-1" type="number" id="search_atk_low" placeholder="0" min="0" max="999">
							<span>to</span>
							<input class="my-1" type="number" id="search_atk_high" placeholder="999" min="0" max="999">

							<br>
							<span class="allow-tabs">Defense&#9;</span>
							<input class="my-1" type="number" id="search_def_low" placeholder="0" min="0" max="999">
							<span>to</span>
							<input class="my-1" type="number" id="search_def_high" placeholder="999" min="0" max="999">

							<br>
							<span class="allow-tabs">Speed&#9;</span>
							<input class="my-1" type="number" id="search_spd_low" placeholder="0" min="0" max="999">
							<span>to</span>
							<input class="my-1" type="number" id="search_spd_high" placeholder="999" min="0" max="999">
						</div>

						<h3 class="card-title d-none">Card info</h3>
					</div>
				</div>
			</div>
			<div class="col-3 py-3">
				<div class="card full-height">
					<div class="card-header">
						<h3 class="card-title">Saved</h3>
					</div>
					<div class="card-body">
						<div id="saved-list" class="d-flex flex-wrap">
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="position-absolute start-0 top-0 ms-1">
		<p class="text-light">Beta v152 TestB</p>
	</div>
	<div class="position-absolute start-0 top-100 ms-1 translate-up">
		<div class="text-white-50">
			<span>Not</span>
			<ul class="mb-1">
				<li>official</li>
				<li>sponsored</li>
				<li>endorsed</li>
				<li>affiliated</li>
			</ul>
			<span>with <u class="text-decoration-dotted" title="Super Linguine Cat Simulator Deluxe Online">SLCSDO</u></span>
		</div>
	</div>
	<div class="position-absolute start-100 top-100 me-1 translate-upleft">
		<a href="credits.txt" class="text-white-50">Credits</a>
	</div>
</body>
</html>
